name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 20.19.4
  PNPM_VERSION: 10.18.1
  RUST_VERSION: 1.88.0

jobs:
  validate-version:
    name: Validate version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: version
        name: Match tag and package versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must use vX.Y.Z, got ${tag}" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          for declared in "${package_version}" "${tauri_version}" "${cargo_version}"; do
            [[ "${declared}" == "${version}" ]] || { echo "Version ${declared} does not match ${version}" >&2; exit 1; }
          done
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  quality:
    name: Quality gate
    needs: validate-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  build-linux:
    name: Build Linux x86_64
    needs: [validate-version, quality]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci --bundles deb,appimage
      - name: Normalize package names
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p release
          deb=(src-tauri/target/release/bundle/deb/*.deb)
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [[ ${#deb[@]} -eq 1 && ${#appimage[@]} -eq 1 ]] || { echo "Expected one DEB and one AppImage" >&2; exit 1; }
          cp "${deb[0]}" "release/PowerPico-Client_${VERSION}_amd64.deb"
          cp "${appimage[0]}" "release/PowerPico-Client_${VERSION}_amd64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release/*
          if-no-files-found: error

  build-macos:
    name: Build macOS ARM64
    needs: [validate-version, quality]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci --no-sign --target aarch64-apple-darwin --bundles dmg
      - name: Normalize package name
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p release
          dmg=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          [[ ${#dmg[@]} -eq 1 ]] || { echo "Expected one DMG" >&2; exit 1; }
          cp "${dmg[0]}" "release/PowerPico-Client_${VERSION}_macos_aarch64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: release/*
          if-no-files-found: error

  prepare-release:
    name: Prepare release assets
    needs: [validate-version, build-linux, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: assets
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: assets
      - name: Verify assets and create checksums
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        working-directory: assets
        run: |
          test -f "PowerPico-Client_${VERSION}_macos_aarch64.dmg"
          test -f "PowerPico-Client_${VERSION}_amd64.deb"
          test -f "PowerPico-Client_${VERSION}_amd64.AppImage"
          sha256sum PowerPico-Client_* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [validate-version, prepare-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          notes="Supported packages: macOS 11+ Apple Silicon DMG and Linux x86_64 DEB/AppImage. The macOS build is unsigned and not notarized. Source code is licensed under GPL-3.0-only."
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "PowerPico Client ${VERSION}" \
            --generate-notes \
            --notes "${notes}"
