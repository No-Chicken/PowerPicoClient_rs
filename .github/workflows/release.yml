name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建和发布的已有标签（格式：vX.Y.Z）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 20.19.4
  PNPM_VERSION: 10.18.1
  RUST_VERSION: 1.88.0

jobs:
  validate-version:
    name: Validate version and release notes
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release-ref.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: release-ref
        name: Resolve release tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${MANUAL_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z, got ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-ref.outputs.tag }}
          fetch-depth: 0

      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || steps.release-ref.outputs.tag }}
          path: release-metadata

      - id: version
        name: Match tag and package versions
        shell: bash
        env:
          TAG: ${{ steps.release-ref.outputs.tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/${TAG}" || {
            echo "Release tag ${TAG} does not exist" >&2
            exit 1
          }
          tag_commit="$(git rev-list -n 1 "${TAG}")"
          head_commit="$(git rev-parse HEAD)"
          [[ "${tag_commit}" == "${head_commit}" ]] || {
            echo "Checked out commit ${head_commit} does not match ${TAG} (${tag_commit})" >&2
            exit 1
          }

          version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          for declared in "${package_version}" "${tauri_version}" "${cargo_version}"; do
            [[ "${declared}" == "${version}" ]] || {
              echo "Version ${declared} does not match ${TAG}" >&2
              exit 1
            }
          done
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate Chinese release notes
        shell: bash
        env:
          TAG: ${{ steps.release-ref.outputs.tag }}
        run: |
          notes="release-metadata/.github/release-notes/${TAG}.md"
          [[ -s "${notes}" ]] || {
            echo "Missing or empty release notes: ${notes}" >&2
            exit 1
          }
          mkdir -p release-note-artifact
          cp "${notes}" "release-note-artifact/${TAG}.md"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.release-ref.outputs.tag }}
          path: release-note-artifact/${{ steps.release-ref.outputs.tag }}.md
          if-no-files-found: error

  quality:
    name: Quality gate
    needs: validate-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.tag }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  build-linux:
    name: Build Linux x86_64
    needs: [validate-version, quality]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.tag }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev libssl-dev libudev-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci --bundles deb,appimage
      - name: Normalize package names
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p release
          deb=(src-tauri/target/release/bundle/deb/*.deb)
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [[ ${#deb[@]} -eq 1 && ${#appimage[@]} -eq 1 ]] || {
            echo "Expected one DEB and one AppImage" >&2
            exit 1
          }
          cp "${deb[0]}" "release/PowerPico-Client_${VERSION}_amd64.deb"
          cp "${appimage[0]}" "release/PowerPico-Client_${VERSION}_amd64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release/*
          if-no-files-found: error

  build-macos:
    name: Build macOS ARM64
    needs: [validate-version, quality]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci --no-sign --target aarch64-apple-darwin --bundles dmg
      - name: Normalize package name
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p release
          dmg=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          [[ ${#dmg[@]} -eq 1 ]] || {
            echo "Expected one DMG" >&2
            exit 1
          }
          cp "${dmg[0]}" "release/PowerPico-Client_${VERSION}_macos_aarch64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: release/*
          if-no-files-found: error

  prepare-release:
    name: Prepare release assets
    needs: [validate-version, build-linux, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: assets
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: assets
      - name: Verify assets and create checksums
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        working-directory: assets
        run: |
          test -f "PowerPico-Client_${VERSION}_macos_aarch64.dmg"
          test -f "PowerPico-Client_${VERSION}_amd64.deb"
          test -f "PowerPico-Client_${VERSION}_amd64.AppImage"
          sha256sum PowerPico-Client_* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [validate-version, prepare-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.validate-version.outputs.tag }}
          path: release-notes
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-version.outputs.tag }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        shell: bash
        run: |
          notes_file="release-notes/${TAG}.md"
          [[ -s "${notes_file}" ]] || {
            echo "Missing release notes artifact: ${notes_file}" >&2
            exit 1
          }

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "PowerPico Client ${VERSION}" \
              --notes-file "${notes_file}" \
              --draft=false \
              --prerelease=false
          else
            gh release create "${TAG}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "PowerPico Client ${VERSION}" \
              --notes-file "${notes_file}"
          fi
