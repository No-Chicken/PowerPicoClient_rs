# Everything runs on tags only: pushing `vX.Y.Z` checks the workspace, builds
# and publishes the macOS package. The Linux and Windows packages are built
# locally (`scripts/upload-release.sh`) and uploaded to the same release.
# A manual run builds the macOS artifact but never publishes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with rust-toolchain.toml: the action needs the channel spelled
  # out, but cargo itself always follows the repository pin.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libgtk-3-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "powerpico-app") | .version')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match powerpico-app ${version}" >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  macos:
    name: Package macOS aarch64
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-aarch64

      - name: Build
        run: cargo build --release -p powerpico-app

      - name: Package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="powerpico-client-${tag}-macos-aarch64"
          mkdir -p "dist/${name}/docs"
          install -m 755 target/release/powerpico-client "dist/${name}/powerpico-client"
          install -m 644 LICENSE README.md THIRD_PARTY_NOTICES.md "dist/${name}/"
          cp -r docs/*.md "dist/${name}/docs/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            notes=".github/release-notes/${tag}.md"
            if [ -f "$notes" ]; then
              gh release create "$tag" dist/* --title "$tag" --notes-file "$notes"
            else
              gh release create "$tag" dist/* --title "$tag" --generate-notes
            fi
          fi
