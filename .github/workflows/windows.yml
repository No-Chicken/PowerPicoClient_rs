name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.19.4
  PNPM_VERSION: 10.18.1
  RUST_VERSION: 1.88.0

jobs:
  windows:
    name: Check and package Windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${{ env.PNPM_VERSION }}" --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Validate and build NSIS and portable packages
        shell: powershell
        run: ./scripts/build-windows.ps1
      - name: Verify checksums and portable contents
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $prefix = "PowerPico-Client_${version}_windows_x86_64"
          $expected = @("$prefix-setup.exe", "$prefix-portable.zip")
          $lines = @(Get-Content artifacts/windows/SHA256SUMS)
          if ($lines.Count -ne $expected.Count) { throw 'Unexpected checksum count' }
          $seen = @()
          foreach ($line in $lines) {
            $hash, $name = $line -split '  ', 2
            if ($name -notin $expected -or $name -in $seen) { throw "Unexpected or duplicate asset: $name" }
            $seen += $name
            $actual = (Get-FileHash "artifacts/windows/$name" -Algorithm SHA256).Hash
            if ($actual -ne $hash) { throw "Checksum mismatch: $name" }
          }
          $portable = Join-Path $env:RUNNER_TEMP 'PowerPico portable test'
          Expand-Archive "artifacts/windows/$prefix-portable.zip" $portable
          foreach ($file in @('powerpico-client.exe', 'README.txt', 'LICENSE.txt', 'THIRD_PARTY_NOTICES.md')) {
            if (-not (Test-Path (Join-Path $portable $file))) { throw "Missing portable file: $file" }
          }
          $source = Get-FileHash src-tauri/target/x86_64-pc-windows-msvc/release/powerpico-client.exe
          $extracted = Get-FileHash (Join-Path $portable 'powerpico-client.exe')
          if ($source.Hash -ne $extracted.Hash) { throw 'Portable executable differs from release build' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-nsis-and-portable
          path: |
            artifacts/windows/*-setup.exe
            artifacts/windows/*-portable.zip
            artifacts/windows/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
