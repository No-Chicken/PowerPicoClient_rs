[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/No-Chicken/PowerPicoClient_rs"
rust-version = "1.98"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Shipped bundles carry no symbols; the release binary drops from tens of
# megabytes of debuginfo to a distributable size.
strip = true
